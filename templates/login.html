<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0">

<title>
AulaMind | Login
</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{

background:
linear-gradient(
135deg,
#03133b,
#071d57,
#03133b
);

font-family:Arial;

display:flex;

justify-content:center;

align-items:center;

min-height:100vh;

padding:30px;

}

.contenedor{

display:flex;

flex-direction:column;

align-items:center;

width:100%;

}

.logo{

width:280px;

max-width:90%;

margin-bottom:30px;

filter:
drop-shadow(
0 0 40px
rgba(
59,
130,
246,
0.6
)
);

}

.card{

background:
rgba(
24,
41,
82,
0.95
);

padding:45px;

border-radius:24px;

width:420px;

max-width:100%;

box-shadow:

0 20px 60px
rgba(
0,
0,
0,
0.5
);

}

h1{

color:white;

text-align:center;

font-size:40px;

margin-bottom:10px;

}

.sub{

color:#cbd5e1;

text-align:center;

margin-bottom:35px;

font-size:18px;

}

input{

width:100%;

padding:18px;

border:none;

border-radius:14px;

margin-bottom:18px;

font-size:18px;

background:white;

}

input:focus{

outline:none;

box-shadow:

0 0 18px
#2563eb;

}

button{

width:100%;

padding:18px;

border:none;

border-radius:14px;

background:

linear-gradient(
90deg,
#2563eb,
#9333ea
);

color:white;

font-size:22px;

font-weight:bold;

cursor:pointer;

transition:.25s;

}

button:hover{

transform:
translateY(
-2px
);

}

#error{

color:#ff8f8f;

margin-top:20px;

text-align:center;

font-size:16px;

}

.registro{

text-align:center;

margin-top:25px;

}

.registro a{

color:#60a5fa;

text-decoration:none;

}

</style>

</head>

<body>

<div class="contenedor">

<img

src="{{ url_for('static', filename='img/logo_aulamind.png') }}"

class="logo"

>

<div class="card">

<h1>
Bienvenido
</h1>

<div class="sub">

Accede a AulaMind

</div>

<input

id="usuario"

placeholder="Correo electrónico"

>

<input

id="password"

type="password"

placeholder="Contraseña"

>

<button onclick="login()">

Ingresar

</button>

<div id="error"></div>

<div class="registro">

<a href="/registro">

Crear cuenta

</a>

</div>

</div>

</div>

<script>

async function login(){

const usuario =

document
.getElementById(
"usuario"
)
.value

const password =

document
.getElementById(
"password"
)
.value

const res = await fetch(

"/api/login",

{

method:"POST",

headers:{

"Content-Type":
"application/json"

},

body:

JSON.stringify({

usuario,
password

})

}

)

const data =
await res.json()

if(data.success){

window.location="/"

}else{

document
.getElementById(
"error"
)
.innerHTML=

"Usuario o contraseña incorrectos"

}

}

</script>

</body>

</html>
