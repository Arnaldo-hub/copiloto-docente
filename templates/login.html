<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0">

<title>
Login
</title>

<style>

body{

background:#03133b;

font-family:Arial;

display:flex;

justify-content:center;

align-items:center;

height:100vh;

margin:0;

}

.card{

background:#182952;

padding:40px;

border-radius:20px;

width:360px;

}

h1{

color:white;

margin-bottom:25px;

text-align:center;

}

input{

width:100%;

padding:15px;

border:none;

border-radius:12px;

margin-bottom:18px;

font-size:18px;

}

button{

width:100%;

padding:16px;

border:none;

border-radius:12px;

background:#22c55e;

color:white;

font-size:20px;

font-weight:bold;

cursor:pointer;

}

#error{

color:#ff7b7b;

margin-top:15px;

text-align:center;

}

</style>

</head>

<body>

<div class="card">

<h1>
🔐 Login Docente
</h1>

<input
id="usuario"
placeholder="Usuario">

<input
id="password"
type="password"
placeholder="Contraseña">

<button onclick="login()">

Ingresar

</button>

<div id="error"></div>

</div>

<script>

async function login(){

const usuario =

document.getElementById(
'usuario'
).value

const password =

document.getElementById(
'password'
).value

const res = await fetch(

'/api/login',

{

method:'POST',

headers:{

'Content-Type':
'application/json'

},

body:JSON.stringify({

usuario,
password

})

}

)

const data =
await res.json()

if(data.success){

window.location='/'

}else{

document.getElementById(
'error'
).innerHTML =

'Usuario o contraseña incorrectos'

}

}

</script>

</body>
</html>
