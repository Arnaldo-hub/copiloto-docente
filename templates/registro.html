<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1">

<title>

Registro

</title>

<style>

body{
background:#03133b;
font-family:Arial;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
margin:0;
}

.card{
background:#182952;
padding:40px;
border-radius:20px;
width:420px;
}

h1{
color:white;
text-align:center;
}

input{

width:100%;
padding:15px;
margin-bottom:15px;

border:none;

border-radius:10px;

font-size:18px;

}

button{

width:100%;

padding:15px;

background:#22c55e;

border:none;

color:white;

font-size:20px;

border-radius:10px;

cursor:pointer;

}

#msg{
color:white;
margin-top:20px;
text-align:center;
}

</style>

</head>

<body>

<div class="card">

<h1>

🧠 Crear Cuenta

</h1>

<input
id="nombre"
placeholder="Nombre">

<input
id="email"
placeholder="Correo">

<input
id="password"
type="password"
placeholder="Contraseña">

<button
onclick="registrar()">

Crear cuenta

</button>

<div id="msg"></div>

</div>

<script>

async function registrar(){

const nombre=
document.getElementById("nombre").value

const email=
document.getElementById("email").value

const password=
document.getElementById("password").value


const r=
await fetch(

"/api/registro",

{

method:"POST",

headers:{

"Content-Type":
"application/json"

},

body:

JSON.stringify({

nombre,
email,
password

})

}

)

const data=
await r.json()

document.getElementById(
"msg"
).innerHTML=

data.mensaje

}

</script>

</body>

</html>
