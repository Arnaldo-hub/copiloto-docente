<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Copiloto Docente</title>
</head>

<body>

<h1>🧠 Copiloto Docente</h1>

<select id="asignatura"></select>
<select id="curso"></select>
<select id="unidad"></select>

<div id="oa"></div>

<button onclick="generar()">🚀 Generar</button>

<pre id="resultado"></pre>

<script>

let BASE = {};

fetch("/api/base")
.then(r=>r.json())
.then(d=>{
  BASE = d;
  cargarAsignaturas();
});

function cargarAsignaturas(){
  for(let a in BASE){
    let o=document.createElement("option");
    o.value=a;o.textContent=a;
    asignatura.appendChild(o);
  }
  cargarCursos();
}

function cargarCursos(){
  curso.innerHTML="";
  for(let c in BASE[asignatura.value]){
    let o=document.createElement("option");
    o.value=c;o.textContent=c;
    curso.appendChild(o);
  }
  cargarUnidades();
}

function cargarUnidades(){
  unidad.innerHTML="";
  for(let u in BASE[asignatura.value][curso.value]){
    let o=document.createElement("option");
    o.value=u;o.textContent=u;
    unidad.appendChild(o);
  }
  cargarOA();
}

function cargarOA(){
  oa.innerHTML="";
  let datos=BASE[asignatura.value][curso.value][unidad.value];

  Object.keys(datos).forEach(k=>{
    let cb=document.createElement("input");
    cb.type="checkbox";
    cb.value=k+": "+datos[k].descripcion;

    oa.appendChild(cb);
    oa.appendChild(document.createTextNode(cb.value));
    oa.appendChild(document.createElement("br"));
  });
}

function generar(){

  let lista=[];
  document.querySelectorAll("#oa input:checked").forEach(x=>lista.push(x.value));

  if(lista.length === 0){
    alert("Selecciona al menos un OA");
    return;
  }

  document.getElementById("resultado").textContent = "Generando...";

  fetch("/api/planificar",{
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({
      asignatura:asignatura.value,
      curso:curso.value,
      unidad:unidad.value,
      oa:lista
    })
  })
  .then(r=>r.json())
  .then(d=>{
    document.getElementById("resultado").textContent = d.plan;
  })
  .catch(()=>{
    alert("Error conectando con servidor");
  });
}

</script>

</body>
</html>
