<!DOCTYPE html>
<html>

<head>

<meta charset="UTF-8">

<title>Historial</title>

<style>

body{
background:#0f172a;
color:white;
font-family:Arial;
padding:30px;
}

.tarjeta{
background:#1e293b;
padding:20px;
margin-bottom:20px;
border-radius:15px;
}

</style>

</head>

<body>

<h1>📚 Historial Docente</h1>

{% if historial %}

{% for h in historial %}

<div class="tarjeta">

<h3>Pregunta</h3>

<p>{{h.pregunta}}</p>

<h3>Respuesta</h3>

<p>{{h.respuesta}}</p>

</div>

{% endfor %}

{% else %}

<h2>No hay historial todavía</h2>

{% endif %}

</body>

</html>
