<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>🧠 Copiloto Docente</title>
</head>

<body>

<h2>🔐 Login Docente</h2>

<input id="user" placeholder="Usuario"><br>
<input id="pass" type="password" placeholder="Contraseña"><br>

<button onclick="login()">Ingresar</button>
<button onclick="registro()">Registrarse</button>

<hr>

<h1>🧠 Copiloto Docente</h1>

<select id="asignatura" onchange="cargarCursos()"></select>
<select id="curso" onchange="cargarUnidades()"></select>
<select id="unidad" onchange="cargarOA()"></select>

<div id="oa"></div>

<button onclick="generar()">🚀 Generar Planificación</button>
<button onclick="verHistorial()">📚 Historial</button>

<pre id="resultado"></pre>

<script>
let BASE = {};

fetch("/api/base")
.then(r => r.json())
.then(d => {
  BASE = d;
  cargarAsignaturas();
});

function cargarAsignaturas(){
  let s = document.getElementById("asignatura");
  for(let a in BASE){
    let o = document.createElement("option");
    o.value=a; o.textContent=a;
    s.appendChild(o);
  }
  cargarCursos();
}

function cargarCursos(){
  let a = asignatura.value;
  curso.innerHTML="";
  for(let c in BASE[a]){
    let o = document.createElement("option");
    o.value=c; o.textContent=c;
    curso.appendChild(o);
  }
  cargarUnidades();
}

function cargarUnidades(){
  let a=asignatura.value,c=curso.value;
  unidad.innerHTML="";
  for(let u in BASE[a][c]){
    let o=document.createElement("option");
    o.value=u;o.textContent=u;
    unidad.appendChild(o);
  }
  cargarOA();
}

function cargarOA(){
  let a=asignatura.value,c=curso.value,u=unidad.value;
  let cont=document.getElementById("oa");
  cont.innerHTML="";
  let datos=BASE[a][c][u];

  Object.keys(datos).forEach(k=>{
    let cb=document.createElement("input");
    cb.type="checkbox";
    cb.value=k+": "+datos[k].descripcion;

    cont.appendChild(cb);
    cont.appendChild(document.createTextNode(cb.value));
    cont.appendChild(document.createElement("br"));
  });
}

function generar(){
  let oa=[];
  document.querySelectorAll("#oa input:checked").forEach(x=>oa.push(x.value));

  fetch("/api/planificar",{
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({
      asignatura:asignatura.value,
      curso:curso.value,
      unidad:unidad.value,
      oa:oa
    })
  })
  .then(r=>r.json())
  .then(d=>resultado.textContent=d.plan);
}

function verHistorial(){
  fetch("/api/historial")
  .then(r=>r.json())
  .then(d=>{
    let t="HISTORIAL\n\n";
    d.forEach(p=>{
      t+=p.asignatura+" "+p.curso+"\n";
      t+=p.plan.substring(0,200)+"...\n\n";
    });
    resultado.textContent=t;
  });
}

function login(){
  fetch("/api/login",{
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({
      usuario:user.value,
      password:pass.value
    })
  })
  .then(r=>r.json())
  .then(d=>alert(d.ok?"Login OK":"Error"));
}

function registro(){
  fetch("/api/registro",{
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({
      usuario:user.value,
      password:pass.value
    })
  })
  .then(r=>r.json())
  .then(d=>alert(d.ok?"Registrado":d.msg));
}
</script>

</body>
</html>
