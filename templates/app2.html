<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Copiloto Docente IA
    </title>

    <style>

        * {

            margin: 0;
            padding: 0;
            box-sizing: border-box;

        }

        body {

            background: #03123d;

            color: white;

            font-family: Arial, sans-serif;

            display: flex;

            min-height: 100vh;

        }

        /* ===================================== */
        /* PANEL IZQUIERDO */
        /* ===================================== */

        .sidebar {

            width: 320px;

            background: #02103a;

            padding: 20px;

            border-right:
                2px solid rgba(255,255,255,0.1);

        }

        .titulo {

            font-size: 20px;

            font-weight: bold;

            margin-bottom: 25px;

        }

        textarea {

            width: 100%;

            height: 160px;

            border-radius: 18px;

            border: none;

            padding: 18px;

            font-size: 16px;

            margin-bottom: 20px;

            resize: none;

        }

        button {

            width: 100%;

            border: none;

            border-radius: 16px;

            padding: 16px;

            color: white;

            font-size: 18px;

            font-weight: bold;

            cursor: pointer;

            margin-bottom: 16px;

            transition: 0.3s;

        }

        button:hover {

            transform: scale(1.02);

        }

        .btn-preguntar {

            background: #22c55e;

        }

        .btn-imagen {

            background: linear-gradient(
                90deg,
                #a855f7,
                #9333ea
            );

        }

        /* ===================================== */
        /* CENTRO */
        /* ===================================== */

        .panel-central {

            width: 420px;

            padding: 20px;

        }

        .card {

            background: rgba(255,255,255,0.08);

            border-radius: 22px;

            padding: 20px;

            margin-bottom: 22px;

        }

        .card h2 {

            margin-bottom: 20px;

            font-size: 18px;

        }

        select {

            width: 100%;

            padding: 14px;

            border-radius: 14px;

            border: none;

            margin-bottom: 16px;

            font-size: 16px;

        }

        .checks {

            display: flex;

            flex-direction: column;

            gap: 14px;

            margin-top: 10px;

        }

        .checks label {

            font-size: 17px;

        }

        .btn-generar {

            background: #22c55e;

        }

        .btn-historial {

            background: #2563eb;

        }

        .btn-pdf {

            background: linear-gradient(
                90deg,
                #9333ea,
                #a855f7
            );

        }

        /* ===================================== */
        /* RESULTADO */
        /* ===================================== */

        .resultado {

            flex: 1;

            padding: 20px;

        }

        .resultado-card {

            background: rgba(255,255,255,0.08);

            border-radius: 22px;

            padding: 30px;

            min-height: 90vh;

            overflow-y: auto;

        }

        .resultado-card h2 {

            margin-bottom: 25px;

            font-size: 28px;

        }

        .resultado-card pre {

            white-space: pre-wrap;

            line-height: 1.8;

            font-size: 17px;

            font-family: Arial;

        }

    </style>

</head>

<body>

    <!-- ================================= -->
    <!-- SIDEBAR -->
    <!-- ================================= -->

    <div class="sidebar">

        <div class="titulo">

            🧠 Chat Docente IA

        </div>

        <textarea
            placeholder="Escribe una pregunta pedagógica..."
        ></textarea>

        <button class="btn-preguntar">

            💬 Preguntar

        </button>

        <button class="btn-imagen">

            🎨 Generar Imagen

        </button>

    </div>

    <!-- ================================= -->
    <!-- CONTEXTO PEDAGÓGICO -->
    <!-- ================================= -->

    <div class="panel-central">

        <div class="card">

            <h2>

                📚 Contexto Pedagógico

            </h2>

            <select id="asignatura">

                <option value="lenguaje">

                    Lenguaje y Comunicación

                </option>

                <option value="matematica">

                    Matemática

                </option>

                <option value="ciencias">

                    Ciencias

                </option>

                <option value="historia">

                    Historia

                </option>

                <option value="musica">

                    Música

                </option>

                <option value="educacionfisica">

                    Educación Física

                </option>

            </select>

            <select id="curso">

                <option>

                    Seleccione curso

                </option>

            </select>

            <select id="unidad">

                <option>

                    Seleccione unidad

                </option>

            </select>

            <select id="oa">

                <option>

                    Seleccione OA

                </option>

            </select>

        </div>

        <!-- ================================= -->
        <!-- OPCIONES -->
        <!-- ================================= -->

        <div class="card">

            <div class="checks">

                <label>
                    <input
                        type="checkbox"
                        id="objetivos"
                    >
                    Objetivos
                </label>

                <label>
                    <input
                        type="checkbox"
                        id="indicadores"
                    >
                    Indicadores
                </label>

                <label>
                    <input
                        type="checkbox"
                        id="habilidades"
                    >
                    Habilidades
                </label>

                <label>
                    <input
                        type="checkbox"
                        id="actitudes"
                    >
                    Actitudes
                </label>

                <label>
                    <input
                        type="checkbox"
                        id="evaluacion"
                    >
                    Evaluación
                </label>

                <label>
                    <input
                        type="checkbox"
                        id="nee"
                    >
                    Adaptaciones NEE
                </label>

            </div>

            <br>

            <button
                id="btnGenerar"
                class="btn-generar"
            >

                🚀 Generar

            </button>

            <button class="btn-historial">

                📚 Historial

            </button>

            <button class="btn-pdf">

                📄 Descargar PDF

            </button>

        </div>

    </div>

    <!-- ================================= -->
    <!-- RESULTADO -->
    <!-- ================================= -->

    <div class="resultado">

        <div
            class="resultado-card"
            id="resultado"
        >

            <h2>

                📄 Resultado IA

            </h2>

            <pre>

Resultado IA aparecerá aquí.

            </pre>

        </div>

    </div>

    <!-- ================================= -->
    <!-- JAVASCRIPT -->
    <!-- ================================= -->

    <script>

        const asignaturaSelect =
            document.getElementById("asignatura");

        const cursoSelect =
            document.getElementById("curso");

        const unidadSelect =
            document.getElementById("unidad");

        const oaSelect =
            document.getElementById("oa");

        // =====================================
        // CURSOS
        // =====================================

        async function cargarCursos() {

            const asignatura =
                asignaturaSelect.value;

            const response = await fetch(

                `/api/cursos/${asignatura}`

            );

            const data =
                await response.json();

            cursoSelect.innerHTML = "";

            data.cursos.forEach((curso) => {

                const option =
                    document.createElement("option");

                option.value = curso;

                option.textContent = curso;

                cursoSelect.appendChild(option);

            });

            cargarUnidades();

        }

        // =====================================
        // UNIDADES
        // =====================================

        async function cargarUnidades() {

            const asignatura =
                asignaturaSelect.value;

            const curso =
                cursoSelect.value;

            const response = await fetch(

                `/api/unidades/${asignatura}/${curso}`

            );

            const data =
                await response.json();

            unidadSelect.innerHTML = "";

            data.unidades.forEach((unidad) => {

                const option =
                    document.createElement("option");

                option.value =
                    unidad.nombre;

                option.textContent =
                    unidad.nombre;

                unidadSelect.appendChild(option);

            });

            cargarOA();

        }

        // =====================================
        // OA
        // =====================================

        async function cargarOA() {

            const asignatura =
                asignaturaSelect.value;

            const curso =
                cursoSelect.value;

            const unidad =
                unidadSelect.value;

            const response = await fetch(

                `/api/oa/${asignatura}/${curso}/${unidad}`

            );

            const data =
                await response.json();

            oaSelect.innerHTML = "";

            data.oa.forEach((item) => {

                const option =
                    document.createElement("option");

                if (typeof item === "object") {

                    option.value =
                        item.descripcion;

                    option.textContent =
                        `${item.codigo} - ${item.descripcion}`;

                }

                else {

                    option.value = item;

                    option.textContent = item;

                }

                oaSelect.appendChild(option);

            });

        }

        // =====================================
        // EVENTOS
        // =====================================

        asignaturaSelect.addEventListener(

            "change",

            cargarCursos

        );

        cursoSelect.addEventListener(

            "change",

            cargarUnidades

        );

        unidadSelect.addEventListener(

            "change",

            cargarOA

        );

        // =====================================
        // GENERAR
        // =====================================

        async function generarPlanificacion() {

            const resultado =
                document.getElementById("resultado");

            resultado.innerHTML = `

                <div class="resultado-card">

                    <h2>
                        ⏳ Generando...
                    </h2>

                </div>

            `;

            const body = {

                asignatura:
                    asignaturaSelect.value,

                curso:
                    cursoSelect.value,

                unidad:
                    unidadSelect.value,

                oa:
                    oaSelect.value,

                objetivos:
                    document.getElementById("objetivos").checked,

                indicadores:
                    document.getElementById("indicadores").checked,

                habilidades:
                    document.getElementById("habilidades").checked,

                actitudes:
                    document.getElementById("actitudes").checked,

                evaluacion:
                    document.getElementById("evaluacion").checked,

                nee:
                    document.getElementById("nee").checked

            };

            try {

                const response =
                    await fetch(

                        "/api/pedagogia",

                        {

                            method: "POST",

                            headers: {

                                "Content-Type":
                                    "application/json"

                            },

                            body:
                                JSON.stringify(body)

                        }

                    );

                const data =
                    await response.json();

                resultado.innerHTML = `

                    <div class="resultado-card">

                        <h2>
                            ✅ Planificación Generada
                        </h2>

                        <pre>
${data.resultado}
                        </pre>

                    </div>

                `;

            }

            catch (error) {

                resultado.innerHTML = `

                    <div class="resultado-card">

                        <h2>
                            ❌ Error
                        </h2>

                        <p>
                            No se pudo generar.
                        </p>

                    </div>

                `;

            }

        }

        // =====================================
        // BOTÓN
        // =====================================

        document
            .getElementById("btnGenerar")
            .addEventListener(

                "click",

                generarPlanificacion

            );

        // =====================================
        // INICIO
        // =====================================

        window.onload = () => {

            cargarCursos();

        };

    </script>

</body>

</html>
