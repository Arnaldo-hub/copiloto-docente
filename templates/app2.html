<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0">

<title>
Copiloto Docente IA
</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
background:#03133b;
color:white;
font-family:Arial;
overflow:hidden;
}

.container{
display:grid;
grid-template-columns:280px 380px 1fr;
height:100vh;
}

.panel{
padding:20px;
overflow:auto;
border-right:1px solid rgba(255,255,255,.08);
}

.card{
background:#182952;
border-radius:18px;
padding:18px;
margin-bottom:18px;
}

h1{
font-size:20px;
margin-bottom:20px;
}

textarea{
width:100%;
height:140px;
border:none;
border-radius:14px;
padding:14px;
font-size:16px;
resize:none;
margin-bottom:16px;
}

select{
width:100%;
padding:14px;
border:none;
border-radius:14px;
margin-bottom:14px;
font-size:16px;
}

button{
width:100%;
padding:14px;
border:none;
border-radius:14px;
font-size:18px;
font-weight:bold;
cursor:pointer;
margin-bottom:12px;
color:white;
}

.btn-green{
background:#22c55e;
}

.btn-blue{
background:#1d74e7;
}

.btn-purple{
background:#9333ea;
}

.resultado{

background:#182952;

border-radius:18px;

padding:30px;

min-height:90vh;

overflow:auto;

line-height:1.9;

font-size:15px;

color:white;

box-shadow:0 0 20px rgba(0,0,0,.3);

}

/* ================================= */
/* MARKDOWN IA */
/* ================================= */

.resultado h1,
.resultado h2,
.resultado h3{

color:#00e5ff;

margin-top:28px;

margin-bottom:16px;

font-weight:bold;

}

.resultado h4,
.resultado h5{

color:#7dd3fc;

margin-top:22px;

margin-bottom:12px;

}

.resultado p{

margin-bottom:16px;

}

.resultado ul{

padding-left:28px;

margin-bottom:18px;

}

.resultado li{

margin-bottom:10px;

}

.resultado strong{

color:#ffffff;

}

.resultado table{

width:100%;

border-collapse:collapse;

margin-top:20px;

margin-bottom:20px;

}

.resultado th,
.resultado td{

border:1px solid rgba(255,255,255,.15);

padding:12px;

}

.resultado th{

background:rgba(0,229,255,.15);

}

.resultado code{

background:rgba(255,255,255,.08);

padding:4px 8px;

border-radius:6px;

}

.checks label{
display:block;
margin-bottom:14px;
font-size:16px;
}

.checks input{
margin-right:10px;
}

#respuestaIA{
margin-top:16px;
line-height:1.6;
white-space:pre-wrap;
font-size:14px;
}

/* ================================= */
/* MODAL HISTORIAL */
/* ================================= */

.modal{

display:none;

position:fixed;

top:0;
left:0;

width:100%;
height:100%;

background:rgba(0,0,0,.7);

justify-content:center;
align-items:center;

z-index:9999;

}

.modal-content{

background:#182952;

width:80%;
max-width:900px;

height:80vh;

overflow:auto;

border-radius:20px;

padding:30px;

position:relative;

}

.close{

position:absolute;

top:15px;
right:20px;

font-size:32px;

cursor:pointer;

}

#contenidoHistorial{

white-space:pre-wrap;

line-height:1.8;

margin-top:20px;

}

@media(max-width:1200px){

.container{
grid-template-columns:1fr;
height:auto;
}

body{
overflow:auto;
}

.panel{
border-right:none;
border-bottom:1px solid rgba(255,255,255,.08);
}

}

</style>

</head>

<body>

<div class="container">

<!-- ================================= -->
<!-- CHAT IA -->
<!-- ================================= -->

<div class="panel">

<h1>
🧠 Chat Docente IA
</h1>

<div class="card">

<textarea
id="preguntaIA"
placeholder="Escribe una pregunta pedagógica...">
</textarea>

<button
class="btn-green"
onclick="preguntarIA()">

💬 Preguntar

</button>

<button
class="btn-purple">

🎨 Generar Imagen

</button>

<div id="respuestaIA"></div>

</div>

</div>

<!-- ================================= -->
<!-- CONTEXTO PEDAGÓGICO -->
<!-- ================================= -->

<div class="panel">

<h1>
📚 Contexto Pedagógico
</h1>

<div class="card">

<select
id="asignatura"
onchange="cargarCursos()">

<option value="matematica">
Matemática
</option>

<option value="lenguaje">
Lenguaje y Comunicación
</option>

<option value="ciencias">
Ciencias Naturales
</option>

<option value="historia">
Historia y Geografía
</option>

<option value="ingles">
Inglés
</option>

<option value="musica">
Música
</option>

<option value="tecnologia">
Tecnología
</option>

<option value="educacionfisica">
Educación Física
</option>

<option value="orientacion">
Orientación
</option>

</select>

<select
id="curso"
onchange="cargarUnidades()">
</select>

<select
id="unidad"
onchange="cargarOA()">
</select>

<select id="oa">
</select>

</div>

<div class="card checks">

<label>
<input type="checkbox" id="objetivos">
Objetivos
</label>

<label>
<input type="checkbox" id="indicadores">
Indicadores
</label>

<label>
<input type="checkbox" id="habilidades">
Habilidades
</label>

<label>
<input type="checkbox" id="actitudes">
Actitudes
</label>

<label>
<input type="checkbox" id="evaluacion">
Evaluación
</label>

<label>
<input type="checkbox" id="nee">
Adaptaciones NEE
</label>

<label>
<input type="checkbox" id="recursos">
Recursos
</label>

<button
class="btn-green"
onclick="generarPlanificacion()">

🚀 Generar

</button>

<button
class="btn-blue"
onclick="mostrarHistorial()">

📚 Historial

</button>

<button
class="btn-purple"
onclick="descargarPDF()">

📄 Descargar PDF

</button>

</div>

</div>

<!-- ================================= -->
<!-- RESULTADO IA -->
<!-- ================================= -->

<div class="panel">

<h1>
📄 Resultado IA
</h1>

<div
class="resultado"
id="resultado">

Resultado IA aparecerá aquí.

</div>

</div>

</div>

<!-- ================================= -->
<!-- MODAL HISTORIAL -->
<!-- ================================= -->

<div
class="modal"
id="modalHistorial">

<div class="modal-content">

<span
class="close"
onclick="cerrarHistorial()">

&times;

</span>

<h1>
📚 Historial
</h1>

<div id="contenidoHistorial"></div>

</div>

</div>

<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script>

const asignaturaSelect =
    document.getElementById("asignatura");

const cursoSelect =
    document.getElementById("curso");

const unidadSelect =
    document.getElementById("unidad");

const oaSelect =
    document.getElementById("oa");


// ======================================
// CARGAR CURSOS
// ======================================

async function cargarCursos() {

    const asignatura =
        asignaturaSelect.value;

    cursoSelect.innerHTML =
        "<option>Cargando...</option>";

    unidadSelect.innerHTML =
        "<option>Seleccione unidad</option>";

    oaSelect.innerHTML =
        "<option>Seleccione OA</option>";

    const response = await fetch(

        `/api/cursos/${encodeURIComponent(asignatura)}`

    );

    const data = await response.json();

    cursoSelect.innerHTML = "";

    data.cursos.forEach((curso) => {

        const option =
            document.createElement("option");

        option.value = curso;

        option.textContent = curso;

        cursoSelect.appendChild(option);

    });

    cargarUnidades();

}


// ======================================
// CARGAR UNIDADES
// ======================================

async function cargarUnidades() {

    const asignatura =
        asignaturaSelect.value;

    const curso =
        cursoSelect.value;

    unidadSelect.innerHTML =
        "<option>Cargando...</option>";

    oaSelect.innerHTML =
        "<option>Seleccione OA</option>";

    const response = await fetch(

        `/api/unidades/${encodeURIComponent(asignatura)}/${encodeURIComponent(curso)}`

    );

    const data = await response.json();

    unidadSelect.innerHTML = "";

    data.unidades.forEach((unidad) => {

        const option =
            document.createElement("option");

        option.value =
            unidad.nombre;

        option.textContent =
            unidad.nombre;

        unidadSelect.appendChild(option);

    });

    cargarOA();

}


// ======================================
// CARGAR OA
// ======================================

async function cargarOA() {

    const asignatura =
        asignaturaSelect.value;

    const curso =
        cursoSelect.value;

    const unidad =
        unidadSelect.value;

    oaSelect.innerHTML =
        "<option>Cargando OA...</option>";

    const response = await fetch(

        `/api/oa/${encodeURIComponent(asignatura)}/${encodeURIComponent(curso)}/${encodeURIComponent(unidad)}`

    );

    const data = await response.json();

    oaSelect.innerHTML = "";

    data.oa.forEach((item) => {

        const option =
            document.createElement("option");

        if (typeof item === "object") {

            option.value =
                item.descripcion;

            option.textContent =
                `${item.codigo} - ${item.descripcion}`;

        }

        else {

            option.value = item;

            option.textContent = item;

        }

        oaSelect.appendChild(option);

    });

}


// ======================================
// EVENTOS
// ======================================

asignaturaSelect.addEventListener(

    "change",

    cargarCursos

);

cursoSelect.addEventListener(

    "change",

    cargarUnidades

);

unidadSelect.addEventListener(

    "change",

    cargarOA

);


// ======================================
// INICIO
// ======================================

window.onload = () => {

    cargarCursos();

};

</script>

</body>
</html>
