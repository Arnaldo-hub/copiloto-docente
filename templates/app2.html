
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Copiloto Docente IA</title>

<style>
body{
margin:0;
background:#03133b;
color:white;
font-family:Arial;
}
.container{
display:grid;
grid-template-columns:350px 450px 1fr;
min-height:100vh;
}
.panel{
padding:20px;
border-right:1px solid rgba(255,255,255,0.1);
}
.card{
background:#1b2b55;
padding:20px;
border-radius:16px;
margin-bottom:20px;
}
select,textarea,button{
width:100%;
padding:14px;
margin-bottom:15px;
border-radius:12px;
border:none;
font-size:16px;
}
button{
background:#22c55e;
color:white;
font-weight:bold;
cursor:pointer;
}
#resultado{
background:#1b2b55;
padding:20px;
border-radius:16px;
min-height:300px;
}
@media(max-width:1200px){
.container{
grid-template-columns:1fr;
}
}
</style>

</head>
<body>

<div class="container">

<div class="panel">

<h1>🧠 Chat IA</h1>

<div class="card">

<textarea
id="preguntaIA"
rows="8"
placeholder="Pregunta pedagógica">
</textarea>

<button onclick="preguntarIA()">
💬 Preguntar
</button>

<div id="respuestaIA"></div>

</div>

</div>

<div class="panel">

<h1>📚 Contexto Pedagógico</h1>

<div class="card">

<select
id="asignatura"
onchange="cargarCursos()">

<option value="matematica">Matemática</option>
<option value="lenguaje">Lenguaje y Comunicación</option>
<option value="ciencias">Ciencias Naturales</option>
<option value="historia">Historia, Geografía y Ciencias Sociales</option>
<option value="artesvisuales">Artes Visuales</option>
<option value="musica">Música</option>
<option value="tecnologia">Tecnología</option>
<option value="orientacion">Orientación</option>

</select>

<select
id="curso"
onchange="cargarUnidades()">
</select>

<select
id="unidad"
onchange="cargarOA()">
</select>

<select id="oa">
</select>

<button>
🚀 Generar Planificación
</button>

</div>

</div>

<div class="panel">

<h1>📄 Resultado</h1>

<div id="resultado">

Sistema curricular dinámico conectado.

</div>

</div>

</div>

<script>

async function preguntarIA(){

    const pregunta =
    document.getElementById('preguntaIA').value

    const respuesta =
    document.getElementById('respuestaIA')

    respuesta.innerHTML = '⏳ Pensando...'

    try{

        const res = await fetch('/api/chat',{

            method:'POST',

            headers:{
                'Content-Type':'application/json'
            },

            body:JSON.stringify({
                pregunta:pregunta
            })
        })

        const data = await res.json()

        respuesta.innerHTML =
        data.respuesta

    }catch(error){

        respuesta.innerHTML =
        'ERROR conectando IA'
    }
}

</script>

<script src="/static/js/frontend_pedagogia.js"></script>

</body>
</html>
