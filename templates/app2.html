<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Copiloto Docente</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial;
}

body{
    background:#07122b;
    color:white;
}

.container{
    display:grid;
    grid-template-columns:320px 420px 1fr;
    height:100vh;
}

.panel{
    border-right:1px solid rgba(255,255,255,0.1);
    padding:20px;
    overflow:auto;
}

.card{
    background:#162544;
    padding:15px;
    border-radius:12px;
    margin-bottom:20px;
}

textarea{
    width:100%;
    height:160px;
    border:none;
    border-radius:10px;
    padding:12px;
}

select{
    width:100%;
    padding:12px;
    margin-bottom:15px;
    border:none;
    border-radius:10px;
}

button{
    width:100%;
    padding:12px;
    border:none;
    border-radius:10px;
    margin-top:10px;
    background:#1fc95c;
    color:white;
    font-size:16px;
    cursor:pointer;
    font-weight:bold;
}

#resultado{
    background:#162544;
    padding:20px;
    border-radius:12px;
    white-space:pre-wrap;
    min-height:400px;
}

#respuestaIA{
    margin-top:15px;
    white-space:pre-wrap;
}

</style>

</head>

<body>

<div class="container">

<!-- PANEL IA -->

<div class="panel">

<h1>🧠 Chat Docente IA</h1>

<div class="card">

<textarea
id="preguntaIA"
placeholder="Escribe una pregunta pedagógica..."></textarea>

<button onclick="preguntarIA()">
💬 Preguntar
</button>

<div id="respuestaIA"></div>

</div>

</div>

<!-- PANEL CURRICULAR -->

<div class="panel">

<h1>📚 Contexto Pedagógico</h1>

<div class="card">

<select id="asignatura"></select>

<select id="curso"></select>

<select id="unidad"></select>

<div id="oa"></div>

</div>

<div class="card">

<label><input type="checkbox" value="Objetivos"> Objetivos</label><br><br>

<label><input type="checkbox" value="Indicadores"> Indicadores</label><br><br>

<label><input type="checkbox" value="Habilidades"> Habilidades</label><br><br>

<label><input type="checkbox" value="Actitudes"> Actitudes</label><br><br>

<label><input type="checkbox" value="Evaluación"> Evaluación</label><br><br>

<label><input type="checkbox" value="Adaptaciones NEE"> Adaptaciones NEE</label><br><br>

<label><input type="checkbox" value="Recursos"> Recursos</label>

<button onclick="generar()">
🚀 Generar
</button>

<button onclick="verHistorial()">
📚 Historial
</button>

<button onclick="descargarPDF()">
📄 Descargar PDF
</button>

<div id="estado"></div>

</div>

</div>

<!-- PANEL RESULTADO -->

<div class="panel">

<h1>📄 Resultado IA</h1>

<div id="resultado"></div>

<h2 style="margin-top:20px;">
📚 Historial
</h2>

<div id="historial"></div>

</div>

</div>

<script>

let BASE = {}

async function cargarBase(){

    const res = await fetch('/api/base')

    BASE = await res.json()

    const asignatura =
    document.getElementById('asignatura')

    asignatura.innerHTML = ''

    Object.keys(BASE).forEach(a=>{

        asignatura.innerHTML +=
        `<option>${a}</option>`

    })

    cargarCursos()
}

function cargarCursos(){

    const asignatura =
    document.getElementById('asignatura').value

    const curso =
    document.getElementById('curso')

    curso.innerHTML = ''

    Object.keys(BASE[asignatura]).forEach(c=>{

        curso.innerHTML +=
        `<option>${c}</option>`

    })

    cargarUnidades()
}

function cargarUnidades(){

    const asignatura =
    document.getElementById('asignatura').value

    const curso =
    document.getElementById('curso').value

    const unidad =
    document.getElementById('unidad')

    unidad.innerHTML = ''

    Object.keys(BASE[asignatura][curso]).forEach(u=>{

        unidad.innerHTML +=
        `<option>${u}</option>`

    })

    cargarOA()
}

function cargarOA(){

    const asignatura =
    document.getElementById('asignatura').value

    const curso =
    document.getElementById('curso').value

    const unidad =
    document.getElementById('unidad').value

    const oaDiv =
    document.getElementById('oa')

    oaDiv.innerHTML = ''

    const oas =
    BASE[asignatura][curso][unidad]

    Object.keys(oas).forEach(oa=>{

        oaDiv.innerHTML += `
        <label style="display:block;margin-bottom:10px;">
        <input
        type="checkbox"
        value="${oas[oa].descripcion}">
        ${oa}: ${oas[oa].descripcion}
        </label>
        `
    })
}

async function generar(){

    document.getElementById('estado').innerText =
    '⏳ Generando con IA...'

    const asignatura =
    document.getElementById('asignatura').value

    const curso =
    document.getElementById('curso').value

    const unidad =
    document.getElementById('unidad').value

    const oa = []

    document
    .querySelectorAll('#oa input:checked')
    .forEach(c=> oa.push(c.value))

    const modulos = []

    document
    .querySelectorAll('.card input:checked')
    .forEach(c=> modulos.push(c.value))

    const res = await fetch('/api/planificar',{

        method:'POST',

        headers:{
            'Content-Type':'application/json'
        },

        body:JSON.stringify({
            asignatura,
            curso,
            unidad,
            oa,
            modulos
        })

    })

    const data = await res.json()

    document.getElementById('resultado').innerText =
    data.plan

    document.getElementById('estado').innerText =
    '✅ Generación completada'
}

async function verHistorial(){

    const res = await fetch('/api/historial',{
        method:'POST'
    })

    const data = await res.json()

    const historial =
    document.getElementById('historial')

    historial.innerHTML = ''

    data.reverse().forEach(item=>{

        historial.innerHTML += `
        <div class="card">
        <b>${item.fecha}</b><br><br>
        ${item.plan.substring(0,200)}...
        </div>
        `
    })
}

async function descargarPDF(){

    const texto =
    document.getElementById('resultado').innerText

    const res = await fetch('/api/pdf',{

        method:'POST',

        headers:{
            'Content-Type':'application/json'
        },

        body:JSON.stringify({
            plan:texto
        })

    })

    const blob = await res.blob()

    const url = window.URL.createObjectURL(blob)

    const a = document.createElement('a')

    a.href = url

    a.download = 'planificacion.pdf'

    a.click()
}

async function preguntarIA(){

    const pregunta =
    document.getElementById('preguntaIA').value

    document.getElementById('respuestaIA').innerText =
    '⏳ Pensando...'

    try{

        const res = await fetch('/api/chat',{

            method:'POST',

            headers:{
                'Content-Type':'application/json'
            },

            body:JSON.stringify({
                pregunta
            })

        })

        const data = await res.json()

        document.getElementById('respuestaIA').innerText =
        data.respuesta

    }catch(error){

        document.getElementById('respuestaIA').innerText =
        'ERROR conectando IA'

    }
}

document
.getElementById('asignatura')
.addEventListener('change', cargarCursos)

document
.getElementById('curso')
.addEventListener('change', cargarUnidades)

document
.getElementById('unidad')
.addEventListener('change', cargarOA)

cargarBase()

</script>

</body>
</html>
