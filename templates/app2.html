<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Copiloto Docente</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial;
}

body{
    background:#07122b;
    color:white;
}

.container{
    display:grid;
    grid-template-columns:320px 420px 1fr;
    height:100vh;
}

.panel{
    border-right:1px solid rgba(255,255,255,0.1);
    padding:20px;
    overflow:auto;
}

h1{
    margin-bottom:20px;
}

.card{
    background:#162544;
    padding:15px;
    border-radius:12px;
    margin-bottom:20px;
}

textarea{
    width:100%;
    height:160px;
    border:none;
    border-radius:10px;
    padding:12px;
}

select{
    width:100%;
    padding:12px;
    margin-bottom:15px;
    border:none;
    border-radius:10px;
}

button{
    width:100%;
    padding:12px;
    border:none;
    border-radius:10px;
    margin-top:10px;
    background:#1fc95c;
    color:white;
    font-size:16px;
    cursor:pointer;
    font-weight:bold;
}

button:hover{
    opacity:0.9;
}

#resultado{
    background:#162544;
    padding:20px;
    border-radius:12px;
    white-space:pre-wrap;
    line-height:1.6;
    min-height:500px;
}

#estado{
    margin-top:15px;
    color:#ffd54f;
    font-weight:bold;
}

</style>
    

</head>

<body>

<div class="container">
    <!-- PANEL 1 -->

<div class="panel">

    <h1>🧠 Chat Docente IA</h1>

    <div class="card">

        <textarea
        id="preguntaIA"
        placeholder="Escribe una pregunta pedagógica..."></textarea>

        <button onclick="preguntarIA()">
            💬 Preguntar
        </button>

        <div id="respuestaIA"
        style="margin-top:15px;"></div>

    </div>

</div>
    <!-- PANEL 2 -->

<div class="panel">

    <h1>📚 Contexto Pedagógico</h1>

    <div class="card">

        <select id="asignatura"></select>

        <select id="curso"></select>

        <select id="unidad"></select>

        <div id="oa"></div>

    </div>

    <h2 style="margin-bottom:15px;">
        ⚙ Generación Modular
    </h2>

    <div class="card">

        <label>
            <input type="checkbox" value="Objetivos">
            Objetivos
        </label>

        <br><br>

        <label>
            <input type="checkbox" value="Indicadores">
            Indicadores
        </label>

        <br><br>

        <label>
            <input type="checkbox" value="Habilidades">
            Habilidades
        </label>

        <br><br>

        <label>
            <input type="checkbox" value="Actitudes">
            Actitudes
        </label>

        <br><br>

        <label>
            <input type="checkbox" value="Evaluación">
            Evaluación
        </label>

        <br><br>

        <label>
            <input type="checkbox" value="Adaptaciones NEE">
            Adaptaciones NEE
        </label>

        <br><br>

        <label>
            <input type="checkbox" value="Recursos">
            Recursos
        </label>

        <button onclick="generar()">
            🚀 Generar
        </button>

        <button onclick="verHistorial()">
            📚 Historial
        </button>

        <button onclick="descargarPDF()">
            📄 Descargar PDF
        </button>

        <div id="estado"></div>

    </div>

</div>
<!-- PANEL 3 -->

<div class="panel">

    <h1>📄 Resultado IA</h1>

    <div id="resultado"></div>

    <h2 style="margin-top:25px;">
        📚 Historial
    </h2>

    <div id="historial"></div>

</div>

</div>
