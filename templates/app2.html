<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Copiloto Docente</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial;
}

body{
    background:#07122b;
    color:white;
}

.container{
    display:grid;
    grid-template-columns:320px 420px 1fr;
    height:100vh;
}

.panel{
    border-right:1px solid rgba(255,255,255,0.1);
    padding:20px;
    overflow:auto;
}

h1{
    margin-bottom:20px;
}

.card{
    background:#162544;
    padding:15px;
    border-radius:12px;
    margin-bottom:20px;
}

textarea{
    width:100%;
    height:160px;
    border:none;
    border-radius:10px;
    padding:12px;
}

select{
    width:100%;
    padding:12px;
    margin-bottom:15px;
    border:none;
    border-radius:10px;
}

button{
    width:100%;
    padding:12px;
    border:none;
    border-radius:10px;
    margin-top:10px;
    background:#1fc95c;
    color:white;
    font-size:16px;
    cursor:pointer;
    font-weight:bold;
}

button:hover{
    opacity:0.9;
}

#resultado{
    background:#162544;
    padding:20px;
    border-radius:12px;
    white-space:pre-wrap;
    line-height:1.6;
    min-height:500px;
}

#estado{
    margin-top:15px;
    color:#ffd54f;
    font-weight:bold;
}

</style>
    

</head>

<body>

<div class="container">
    <!-- PANEL 1 -->

<div class="panel">

    <h1>🧠 Chat Docente IA</h1>

    <div class="card">

        <textarea
        id="preguntaIA"
        placeholder="Escribe una pregunta pedagógica..."></textarea>

        <button onclick="preguntarIA()">
            💬 Preguntar
        </button>

        <div id="respuestaIA"
        style="margin-top:15px;"></div>

    </div>

</div>
