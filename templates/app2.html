<!DOCTYPE html>
<html lang='es'>
<head>
<meta charset='UTF-8'>
<meta name='viewport' content='width=device-width, initial-scale=1.0'>
<title>AulaMind IA</title>

<style>

body{
    margin:0;
    background:#03133b;
    color:white;
    font-family:Arial;
}

.header{
    background:#0d47a1;
    padding:15px;
    text-align:center;
}

.container{
    display:grid;
    grid-template-columns:350px 1fr;
    min-height:100vh;
}

.panel{
    padding:20px;
}

.card{
    background:#1b2b55;
    padding:20px;
    border-radius:16px;
}

select,
button{
    width:100%;
    padding:14px;
    border:none;
    border-radius:12px;
    margin-bottom:15px;
    font-size:16px;
}

button{
    background:#22c55e;
    color:white;
    font-weight:bold;
}

#resultado{
    background:#1b2b55;
    padding:20px;
    border-radius:16px;
    min-height:500px;
}

@media(max-width:900px){

.container{
    grid-template-columns:1fr;
}

}

</style>
</head>

<body>

<div class='header'>

<h1>🧠 AulaMind IA</h1>

<p>
Inteligencia artificial al servicio de la educación
</p>

</div>

<div class='container'>

<div class='panel'>

<div class='card'>

<h2>📚 Contexto Pedagógico</h2>

<select id='asignatura' onchange='cargarUnidades()'>
<option>Lenguaje</option>
<option>Matematica</option>
<option>Ciencias</option>
<option>Historia</option>
</select>

<select id='curso' onchange='cargarUnidades()'>
<option>1° Básico</option>
<option>2° Básico</option>
<option>3° Básico</option>
</select>

<select id='unidad' onchange='cargarOA()'></select>

<select id='oa'></select>

<label><input type='checkbox'> Objetivos</label><br><br>
<label><input type='checkbox'> Indicadores</label><br><br>
<label><input type='checkbox'> Habilidades</label><br><br>
<label><input type='checkbox'> Actitudes</label><br><br>

<button onclick='generarPlanificacion()'>
🚀 Generar Planificación
</button>

</div>

</div>

<div class='panel'>

<h1>📄 Resultado IA</h1>

<div id='resultado'>
Resultado pedagógico aparecerá aquí.
</div>

</div>

</div>

<script src='/static/js/frontend_pedagogia.js'></script>

</body>
</html>
